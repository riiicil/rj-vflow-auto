<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJ V-Flow Auto</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Top Header Bar -->
    <header class="popup-header">
      <div class="brand-group">
        <div class="brand-title">
          <img src="../assets/logo/logo_rj.png" alt="RJ" class="brand-logo-img">
          <span>V-Flow</span>
        </div>
        <span class="version-tag">v3.0.0</span>
      </div>
      <button id="btnLaunchOverlay" class="rj-btn rj-btn-secondary rj-btn-sm" title="Launch In-Page Studio HUD">
        <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span>Open HUD</span>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="popup-content">
      <!-- Section 1: Platform Live Detector -->
      <section class="rj-card">
        <div class="rj-card-title rj-card-title-split">
          <div class="rj-title-text">
            <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            <span>Target Platform</span>
          </div>
          <span id="platformStatusBadge" class="rj-status-badge rj-status-unmatched" title="Tab match status">
            <svg id="statusIcon" class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="statusText">Checking</span>
          </span>
        </div>

        <div class="platform-info-row">
          <span class="platform-name">Google Flow</span>
          <code class="platform-url">flow.google.com</code>
        </div>

        <!-- State 1: Unmatched Warning Banner -->
        <div id="platformWarningBanner" class="rj-platform-warning" style="display: none;">
          <span id="warningMessage">Google Flow Not Detected. Please navigate to flow.google.com to use this automation extension.</span>
          <a id="btnNavigatePlatform" class="rj-platform-link">Open Google Flow</a>
        </div>

        <!-- State 2: Connected Notice -->
        <div id="platformConnectedBanner" class="platform-connected-info" style="display: none;">
          <svg class="rj-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Automation engine ready on active tab.</span>
        </div>
      </section>

      <!-- Section 2: Batch Engine Telemetry -->
      <section class="rj-card">
        <div class="rj-card-title">
          <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span>Engine Telemetry</span>
        </div>

        <div class="telemetry-grid">
          <div class="telemetry-box">
            <span class="telemetry-box-label">Engine</span>
            <span id="telemetryEngine" class="telemetry-box-val">Idle</span>
          </div>
          <div class="telemetry-box">
            <span class="telemetry-box-label">Pending</span>
            <span id="telemetryPending" class="telemetry-box-val">0</span>
          </div>
          <div class="telemetry-box">
            <span class="telemetry-box-label">Done</span>
            <span id="telemetryDone" class="telemetry-box-val">0</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Action Bar -->
    <footer class="popup-footer">
      <button type="button" id="btnOpenFlow" class="rj-btn rj-btn-secondary" style="display: none;" title="Open Google Flow in new tab">
        <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span>Open Google Flow</span>
      </button>

      <button type="button" id="btnToggleHud" class="rj-btn rj-btn-accent">
        <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span id="btnToggleText">Open Studio HUD</span>
      </button>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
