<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJ V-Flow Auto</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header Bar -->
    <header class="popup-header">
      <div class="brand-group">
        <img src="../assets/logo/logo_rj.png" alt="RJ Logo" class="brand-logo">
        <div class="brand-text">
          <span class="brand-title">RJ V-Flow Auto</span>
          <span class="brand-subtitle">Studio Automation</span>
        </div>
      </div>
      <span class="version-badge">v3.0.0</span>
    </header>

    <!-- Main Content -->
    <main class="popup-body">
      <!-- Connection Status Card -->
      <div id="statusCard" class="status-card status-checking">
        <div class="status-indicator-row">
          <div class="status-dot"></div>
          <span id="statusLabel" class="status-label">Checking Platform...</span>
        </div>
        <p id="statusDescription" class="status-desc">Scanning active browser tab...</p>
      </div>

      <!-- Actions -->
      <div class="action-group">
        <button id="btnToggleHud" class="rj-btn rj-btn-primary" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          <span id="btnToggleText">Open Studio HUD</span>
        </button>

        <button id="btnOpenFlow" class="rj-btn rj-btn-secondary" style="display: none;">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span>Open Google Flow</span>
        </button>
      </div>

      <!-- Telemetry Bar -->
      <div class="telemetry-bar">
        <div class="telemetry-item">
          <span class="telemetry-label">Engine</span>
          <span id="telemetryEngine" class="telemetry-val">Idle</span>
        </div>
        <div class="telemetry-divider"></div>
        <div class="telemetry-item">
          <span class="telemetry-label">Pending</span>
          <span id="telemetryPending" class="telemetry-val">0</span>
        </div>
        <div class="telemetry-divider"></div>
        <div class="telemetry-item">
          <span class="telemetry-label">Done</span>
          <span id="telemetryDone" class="telemetry-val">0</span>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
